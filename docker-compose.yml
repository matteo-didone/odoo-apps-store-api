services:
  api:
    build: .
    image: odoo-store-api:0.1.0
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      # La cache e gli snapshot sopravvivono ai riavvii del container.
      - store-data:/srv/data
    restart: unless-stopped

volumes:
  store-data:
